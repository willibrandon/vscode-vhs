name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out protected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install pinned VHS
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/charmbracelet/vhs/releases/download/v0.11.0/vhs_0.11.0_Linux_x86_64.tar.gz \
            --output "$RUNNER_TEMP/vhs.tar.gz"
          echo "99cb634587eaae0473c1ea377db80c3a048c27f99fe0a7febb1a1e8cb7ee5009  $RUNNER_TEMP/vhs.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/vhs-bin"
          tar --extract --gzip --file "$RUNNER_TEMP/vhs.tar.gz" --strip-components 1 \
            --directory "$RUNNER_TEMP/vhs-bin" vhs_0.11.0_Linux_x86_64/vhs
          echo "$RUNNER_TEMP/vhs-bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run verify
      - name: Check release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ./scripts/check-release.mjs
      - run: npm run check:registry-identity
      - name: Verify publishing credentials
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          test -n "$VSCE_PAT" || { echo "VSCE_PAT is required" >&2; exit 1; }
          test -n "$OVSX_PAT" || { echo "OVSX_PAT is required" >&2; exit 1; }
          npx vsce verify-pat willibrandon
          npx ovsx verify-pat willibrandon --pat "$OVSX_PAT"
      - run: npm run package
      - run: npm run check:release-reproducibility
      - run: xvfb-run -a npm run test:vsix:prepared
      - run: npm run test:remote:prepared
      - name: Record artifact paths
        run: |
          VERSION=$(node -p "require('./package.json').version")
          {
            echo "VERSION=$VERSION"
            echo "VSIX_PATH=dist/vhs-$VERSION.vsix"
            echo "CHECKSUM_PATH=dist/vhs-$VERSION.sha256"
            echo "SBOM_PATH=dist/vhs-$VERSION.cdx.json"
          } >> "$GITHUB_ENV"
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.VSIX_PATH }}
      - name: Attest CycloneDX SBOM
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.VSIX_PATH }}
          sbom-path: ${{ env.SBOM_PATH }}
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: |
          provenance_asset="dist/vhs-$VERSION.provenance.json"
          sbom_attestation_asset="dist/vhs-$VERSION.sbom-attestation.json"
          cp -- "$PROVENANCE_BUNDLE" "$provenance_asset"
          cp -- "$SBOM_BUNDLE" "$sbom_attestation_asset"
          assets=("$VSIX_PATH" "$CHECKSUM_PATH" "$SBOM_PATH" "$provenance_asset" "$sbom_attestation_asset")
          if release_state=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$release_state" = "true" || { echo "Release is already public" >&2; exit 1; }
            gh release edit "$GITHUB_REF_NAME" --draft --title "VHS $VERSION" --verify-tag
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --draft --verify-tag --title "VHS $VERSION" --notes-from-tag
          fi
      - name: Publish exact VSIX to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "$VSIX_PATH" --no-dependencies --skip-duplicate
      - name: Publish exact VSIX to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish "$VSIX_PATH" --pat "$OVSX_PAT" --skip-duplicate
      - run: npm run verify:marketplace
      - run: npm run verify:open-vsx
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
